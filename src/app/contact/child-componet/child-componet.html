<form>
  <input
    [value]="name()"
    (input)="name.set($any($event.target).value)"
    placeholder="Name" />

  <input
    [value]="phone()"
    (input)="phone.set($any($event.target).value)"
    placeholder="Mobile Number" />

  <input
    [value]="email()"
    (input)="email.set($any($event.target).value)"
    placeholder="Email" />

  <button type="button" (click)="submit()">
    {{ contact() ? 'Update' : 'Add' }}
  </button>
</form>
