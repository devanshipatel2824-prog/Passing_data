<form>
  <input
    [(ngModel)]="name"
    name="name"
    placeholder="Name">

  <input
    [(ngModel)]="phone"
    name="phone"
    placeholder="Mobile Number">

  <input
    [(ngModel)]="email"
    name="email"
    placeholder="Email">

  <button type="button" (click)="submit()">
    {{ editContactData ()? 'Update' : 'Add' }}
  </button>
</form>
