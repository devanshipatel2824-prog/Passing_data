<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
 Add Contect
</button>

<!-- POPUP -->
@if (showForm) {

  <!-- background overlay -->
  <div class="modal-backdrop" (click)="closeForm()"></div>

  <!-- popup box -->
  <div class="modal-box">
    <h3>{{ editIndex !== null ? 'Edit Contact' : 'Add Contact' }}</h3>


    
  </div>
}

<hr>

<table class="contact-table" *ngIf="contacts.length > 0">
  <thead>
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Phone</th>
      <th>Email</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody>
    @for (c of contacts; track $index) {
      <tr>
        <td>{{ $index + 1 }}</td>
        <td>{{ c.name }}</td>
        <td>{{ c.phone }}</td>
        <td>{{ c.email }}</td>
        <td>
          <button
  class="edit-btn"
  data-bs-toggle="modal"
  data-bs-target="#exampleModal"
  (click)="editContact(c, $index)">
  Edit
</button>
          <button class="delete-btn" (click)="deleteContact($index)">
            Delete
          </button>
        </td>
      </tr>
    }
  </tbody>
</table>


<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Contect form</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <app-child-componet
      [editContactData]="selectedContact"
      (contactAdded)="addContactToParent($event)">
    </app-child-componet>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        
      </div>
    </div>
  </div>
</div>
